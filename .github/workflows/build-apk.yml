name: Build Android APK

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Clean Stale Build Caches
        run: |
          rm -rf .gradle .kotlin .build-outputs build app/build local.properties

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK Licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0"

      - name: Generate Valid Debug Keystore
        run: |
          rm -f debug.keystore app/debug.keystore ~/.android/debug.keystore
          mkdir -p ~/.android
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          cp debug.keystore app/debug.keystore
          cp debug.keystore ~/.android/debug.keystore

      - name: Setup Gradle 8.9
        run: |
          curl -sL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle-8.9.zip
          unzip -q /tmp/gradle-8.9.zip -d /tmp/gradle
          chmod +x /tmp/gradle/gradle-8.9/bin/gradle

      - name: Build Debug APK
        run: |
          /tmp/gradle/gradle-8.9/bin/gradle assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Caliper-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          
