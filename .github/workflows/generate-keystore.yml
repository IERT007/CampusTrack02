name: Generate Permanent Keystore

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate Keystore & Base64
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          K_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          keytool -genkeypair -v \
            -keystore caliper-release.jks \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias "$K_ALIAS" \
            -storepass "$KS_PASS" -keypass "$KS_PASS" \
            -dname "CN=Caliper, OU=ToolEngg, O=IERT, L=Prayagraj, S=UP, C=IN"
          base64 -w 0 caliper-release.jks > keystore_base64.txt

      - name: Upload Keystore Bundle
        uses: actions/upload-artifact@v4
        with:
          name: caliper-keystore-bundle
          path: |
            caliper-release.jks
            keystore_base64.txt
          retention-days: 1
