name: Build & Release Caliper APK

on:
  push:
    branches: [ "v1-stable", "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Detect Gradle Version
        id: gradle_ver
        run: |
          if [ -f "gradle/wrapper/gradle-wrapper.properties" ]; then
            VER=$(grep -oP 'gradle-\K[0-9.]+(?=-)' gradle/wrapper/gradle-wrapper.properties | head -n 1)
          fi
          echo "version=${VER:-8.9}" >> $GITHUB_OUTPUT

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ steps.gradle_ver.outputs.version }}

      - name: Decode Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "${{ github.workspace }}/caliper-release.jks"

      - name: Build Signed Release APK
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/caliper-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          gradle assembleRelease

      - name: Extract Version & Prepare APK
        id: meta
        run: |
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts || echo "2.0.0")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          cp "$APK_PATH" "Caliper-v${VERSION}-release.apk"

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Caliper-v${{ steps.meta.outputs.version }}-release
          path: Caliper-v${{ steps.meta.outputs.version }}-release.apk

      - name: Publish GitHub Release (For In-App OTA)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.meta.outputs.version }}
          name: Caliper v${{ steps.meta.outputs.version }}
          files: Caliper-v${{ steps.meta.outputs.version }}-release.apk
          generate_release_notes: true
          make_latest: true
